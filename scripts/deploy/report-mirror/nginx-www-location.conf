# Include inside the existing HTTPS server for www.dreammate.work.
# Keep the report files separate from the official website's build directory.
location = /report {
    return 302 /report/ai-transformation-2026/;
}
location = /report/ {
    return 302 /report/ai-transformation-2026/;
}
location ^~ /report/ {
    alias /var/www/report.dreammate.work/;
    index index.html;
    autoindex off;
}
