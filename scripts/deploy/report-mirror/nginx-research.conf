server {
    listen 80;
    server_name research.dreammate.work;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/report-acme;
    }
    location / {
        return 301 https://research.dreammate.work$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name research.dreammate.work;
    ssl_certificate /etc/letsencrypt/live/research.dreammate.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/research.dreammate.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    location = / {
        return 302 /report/ai-transformation-2026/;
    }
    location = /report {
        return 302 /report/ai-transformation-2026/;
    }
    location = /report/ {
        return 302 /report/ai-transformation-2026/;
    }
    location ^~ /report/ {
        alias /var/www/report.dreammate.work/;
        index index.html;
        autoindex off;
    }
    location / {
        return 404;
    }
}
