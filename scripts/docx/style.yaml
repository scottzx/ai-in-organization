# 《企业数智化转型思路》Word 排版参数（集中配置，待确认项标 TODO）
book:
  title: 《企业数智化转型思路》   # 唯一书名字段（Scott 2026-10-30 定）：扉页、页眉、版权页、docx 文件属性均引用此处
  subtitle: ""
  # 研究院不单独署名（Scott 2026-10-30 定）：不设 author 字段，扉页、版权页、docx 文件属性均不写编著单位
  copyright_holder: 杭州一芥智能有限公司   # 著作权人
  edition: 二次修订版（排版样张）
  date: 2026年10月
page:
  size: A4
  margin_top_cm: 2.54
  margin_bottom_cm: 2.54
  margin_left_cm: 2.8
  margin_right_cm: 2.6
  header_font: Noto Serif SC      # 思源宋体（原宋体，Scott 2026-10-30 定改开源字体）
  header_size_pt: 9          # 小五
  footer_size_pt: 9
  front_matter_page_format: lowerRoman   # 版权页/目录 用罗马页码
  body_restart_page_number: true
fonts:
  latin: Source Serif 4      # 西文字体（总编辑 2026-10-30 定）：Source Serif 4 4.005 TTF，SIL OFL 1.1，随仓库放在 scripts/docx/fonts/SourceSerif4/（含 LICENSE.md）
  color: "000000"            # 全部黑色，含标题、超链接
  line_spacing_exact_pt: 28  # 固定值行距
  space_before_pt: 0
  space_after_pt: 0
  glyph_fallback: [Noto Serif SC, Noto Sans SC]   # 缺字回退：所用中文字体没有某字形时（如朱雀仿宋 0.212 缺 ＋ ｜ ③ ④），该字改用这些已嵌入的开源字体，见 glyph_fallback.py
  embed:                     # Word 嵌入字体（Scott 2026-10-30 定）：fonts_embed.py 按字体名查找字体文件（.ttf/.otf；.ttc 不能嵌入）
    enabled: true
    search_dirs: [fonts, fonts/cache, ~/.fonts, ~/.local/share/fonts, /usr/share/fonts, /usr/local/share/fonts, C:/Windows/Fonts]   # 另可用环境变量 BOOK_FONT_DIR 指定
    subset: true             # 只嵌入本书用到的字（子集），否则每册 docx 多 80 MB 以上
    files:                   # 文件名；也按字体内部名称（name 表）匹配。中文字体由 fonts/fetch_fonts.py 下载到 fonts/cache/（不入 git）
      Noto Sans SC: [notosanssc-regular.ttf, notosanssc-bold.ttf]                 # 思源黑体，替代黑体
      Noto Serif SC: [notoserifsc-regular.ttf, notoserifsc-bold.ttf]              # 思源宋体，替代宋体
      LXGW WenKai: [lxgwwenkai-regular.ttf]                                       # 霞鹜文楷，替代楷体_GB2312
      Zhuque Fangsong (technical preview): [zhuquefangsong-regular.ttf]           # 朱雀仿宋，替代仿宋_GB2312
      Source Serif 4: [sourceserif4-regular.ttf, sourceserif4-bold.ttf]
levels:
  h1: {font: Noto Sans SC,          size_pt: 16, bold: true, align: center, page_break_before: true}  # 思源黑体 三号
  h2: {font: LXGW WenKai,   size_pt: 15, bold: true, align: left}   # 霞鹜文楷 小三
  h3: {font: Zhuque Fangsong (technical preview),   size_pt: 14, bold: true, align: left}
  h4: {font: Zhuque Fangsong (technical preview),   size_pt: 12, bold: true,  align: left}
  body: {font: Zhuque Fangsong (technical preview), size_pt: 12, bold: false, align: justify, first_line_chars: 2}  # Scott 已定（2026-10-29）：4 个英文字符＝2 个中文字符（firstLineChars=200，12pt 时 firstLine=480 twips＝24pt）
  caption: {font: Noto Sans SC,     size_pt: 10.5, bold: false, align: center}   # 五号（Scott 2026-10-30 定）
  table: {font: Zhuque Fangsong (technical preview), size_pt: 10.5, bold: false, align: left}  # 五号（Scott 2026-10-30 定）
  footnote: {font: Zhuque Fangsong (technical preview), size_pt: 10.5, bold: false, align: justify}   # 五号
  figure_note: {font: Zhuque Fangsong (technical preview), size_pt: 10.5, bold: false, align: center}   # 图下来源注
  toc_title: {font: Noto Sans SC, size_pt: 16, bold: true}
numbering:
  chapter_format: "第{cn}章　{title}"   # 一级：中文数字
  figure_format: "图 {ch}-{n}　{title}"
  table_format: "表 {ch}-{n}　{title}"
  table_caption_position: above
  figure_caption_position: below
