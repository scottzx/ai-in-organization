  margin_top_cm: 2.54
  margin_bottom_cm: 2.54
  margin_left_cm: 2.8
  margin_right_cm: 2.6
  header_font: 宋体
  header_size_pt: 9          # 小五
  footer_size_pt: 9
  front_matter_page_format: lowerRoman   # 版权页/目录 用罗马页码
  body_restart_page_number: true
fonts:
  latin: Times New Roman
  color: "000000"            # 全部黑色，含标题、超链接
  line_spacing_exact_pt: 28  # 固定值行距
  space_before_pt: 0
  space_after_pt: 0
levels:
  h1: {font: 黑体,          size_pt: 16, bold: true, align: center, page_break_before: true}  # 黑体 三号
  h2: {font: 楷体_GB2312,   size_pt: 15, bold: true, align: left}   # 楷体_GB2312 小三
  h3: {font: 仿宋_GB2312,   size_pt: 14, bold: true, align: left}
  h4: {font: 仿宋_GB2312,   size_pt: 12, bold: true,  align: left}
  body: {font: 仿宋_GB2312, size_pt: 12, bold: false, align: justify, first_line_chars: 4}  # Scott 已定：4 字符（firstLineChars=400，等效 48pt）
  caption: {font: 黑体,     size_pt: 12, bold: false, align: center}   # TODO 图题表题字体字号待确认
  table: {font: 仿宋_GB2312, size_pt: 10.5, bold: false, align: left}  # TODO 表内字号待确认
  footnote: {font: 仿宋_GB2312, size_pt: 10.5, bold: false, align: justify}   # 五号
  figure_note: {font: 仿宋_GB2312, size_pt: 10.5, bold: false, align: center}   # 图下来源注
  toc_title: {font: 黑体, size_pt: 16, bold: true}
numbering:
  chapter_format: "第{cn}章　{title}"   # 一级：中文数字
  figure_format: "图 {ch}-{n}　{title}"
  table_format: "表 {ch}-{n}　{title}"
  table_caption_position: above
  figure_caption_position: below
toc:
  levels: "1-2"   # 目录只列到 X.Y
# 上册试转：文件 -> 新章号（None=不编号的前后部分）
