# 构建时排除（glob，对文件名匹配）；另按“导航页”特征自动排除
exclude:
  patterns: ["备份-*.md", "README.md", "导图大纲-*.md", "*.blueprint.json"]
  files: []
  force_include: ["中册-行业解决方案/附录A-行业方案选用与能力对照表.md"]   # 不受导航页自动排除，作中册附录A
  # 中册 16 个门类导读页（据中册同编号对照表）。
  # 内容主笔的 PR 将其改名为 X00-门类导读（如 A00-农业与养殖导读.md）；改名前后两种文件名都识别。
  # mode: exclude = 不进正文（默认，避免与同编号正文冲突、扰乱图号）；
  #       include_x00 = 改名后的 X00 导读页作为门类入口进目录（不编章号/图号），旧名仍排除。
  guide_pages:
    mode: include_x00   # 已定：X00 导读页作为门类入口进目录
    dir: 中册-行业解决方案
    current: []   # 旧门类导读文件名均已不存在（#13 后清空）
    x00_patterns: ["[A-Z]00-*.md", "[A-Z][0-9][0-9]-00-*.md"]   # C 门类分组形式如 C08-00-*.md
  nav_page_detect: true
  nav_page_max_chars: 1500   # 去掉链接后正文少于该字数、且以链接列表为主的视为分篇入口/跳转页
# 图片清单（中册用）：保留/删除/重绘、来源、CC 声明。由 make_image_manifest.py 从审读意见生成
images:
  manifest: image-manifest.yaml
  note_format: "资料来源：{source}。{cc}"
  cc_note: "本图不适用本书 CC BY-NC-SA 4.0 许可。"
  edition: ebook        # ebook / print：审读意见“保留（电子书）/重绘（纸书）”按此取舍
checks:
  # 版权页识别标记：PDF 某页含任一标记即视为版权页，页内网址（CC 许可协议、项目仓库地址）不算裸链（总编辑定）
  copyright_page_markers: [版权页, 版权所有, 著作权人, CC BY, 知识共享]
