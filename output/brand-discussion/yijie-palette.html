<div id="yijie-palette-study" aria-label="一芥品牌配色：墨绿、米白、香槟老金与深墨色，附金属光泽应用示意">
  <style>
    #yijie-palette-study{--yj-green:#285b4d;--yj-paper:#f7f4eb;--yj-gold:#cbb078;--yj-metal:linear-gradient(115deg,#a78543 0%,#cfb376 26%,#f0deac 48%,#c2a061 72%,#e2ca92 100%);--yj-ink:#202d29;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    #yijie-palette-study *{box-sizing:border-box}
    #yijie-palette-study .yj-proof{display:grid;grid-template-columns:1fr 1.4fr;min-height:220px}
    #yijie-palette-study .yj-identity{background:var(--yj-green);color:var(--yj-paper);padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:35px}
    #yijie-palette-study .yj-wordmark{font-family:"Songti SC",SimSun,serif;font-size:45px;letter-spacing:8px;font-weight:500;background:var(--yj-metal);background-clip:text;-webkit-background-clip:text;color:transparent;align-self:flex-start}
    #yijie-palette-study .yj-institute{font-size:13px;letter-spacing:3px;color:#e3cb94}
    #yijie-palette-study .yj-reading{background:var(--yj-paper);color:var(--yj-ink);padding:32px;display:flex;flex-direction:column;justify-content:center;gap:15px}
    #yijie-palette-study .yj-rule{width:60px;height:3px;background:var(--yj-metal)}
    #yijie-palette-study .yj-report{font-size:24px;font-family:"Songti SC",SimSun,serif;font-weight:500;line-height:1.6}
    #yijie-palette-study .yj-subtitle{font-size:13px;color:var(--yj-green)}
    #yijie-palette-study .yj-colors{display:grid;grid-template-columns:repeat(4,1fr)}
    #yijie-palette-study .yj-color{padding:20px 14px;min-height:108px;display:flex;flex-direction:column;gap:7px;font-size:13px;line-height:1.6}
    #yijie-palette-study .yj-color span{font-size:11px}
    #yijie-palette-study .yj-green{background:var(--yj-green);color:var(--yj-paper)}
    #yijie-palette-study .yj-paper{background:var(--yj-paper);color:var(--yj-ink)}
    #yijie-palette-study .yj-gold{background:var(--yj-metal);color:var(--yj-ink)}
    #yijie-palette-study .yj-ink{background:var(--yj-ink);color:var(--yj-paper)}
    @media(max-width:480px){#yijie-palette-study .yj-proof{grid-template-columns:1fr}#yijie-palette-study .yj-identity{padding:25px;gap:20px}#yijie-palette-study .yj-wordmark{font-size:36px}#yijie-palette-study .yj-reading{padding:25px}#yijie-palette-study .yj-colors{grid-template-columns:1fr 1fr}}
  </style>
  <div class="yj-proof">
    <div class="yj-identity"><div class="yj-wordmark">一芥</div><div class="yj-institute">智能研究院</div></div>
    <div class="yj-reading"><div class="yj-rule"></div><div class="yj-report">企业数智化转型<br>研究报告</div><div class="yj-subtitle">从智力服务到精益经营</div></div>
  </div>
  <div class="yj-colors" aria-label="建议色值及用途">
    <div class="yj-color yj-green">墨绿 · 主色<span>#285B4D<br>品牌、标题、重点入口</span></div>
    <div class="yj-color yj-paper">米白 · 底色<span>#F7F4EB<br>报告、网页阅读背景</span></div>
    <div class="yj-color yj-gold">香槟老金 · 点睛<span>#CBB078<br>字标、细线、重点入口</span></div>
    <div class="yj-color yj-ink">深墨 · 正文<span>#202D29<br>长文、数据与图注</span></div>
  </div>
</div>
