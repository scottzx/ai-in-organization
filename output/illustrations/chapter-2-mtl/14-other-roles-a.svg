<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">技术辅助围绕岗位业务目标展开</title>
<desc id="description">电商、客服、市场和法务分别从业务目标出发确定辅助任务，人员核实依据、完成专业判断并承担交付责任。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-14  /  其他岗位</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">技术辅助围绕岗位业务目标展开</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">先确定业务目标，再明确技术辅助范围与人的责任。</text>
<rect x="104" y="307" width="766" height="380" rx="12" fill="#F3F6FC"/>
<rect x="104" y="307" width="5" height="380" rx="0" fill="#1D4ED8"/>
<text x="136" y="365" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">电商运营与设计创意</text>
<polyline points="136,392 838,392" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="136" y="437" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">业务目标</text>
<text x="282" y="437" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">合格素材及时上架，实物投入</text>
<text x="282" y="473" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">用于更值得经营的款式。</text>
<text x="136" y="521" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">技术辅助</text>
<text x="282" y="521" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">生成款式展示、商品图与视频；</text>
<text x="282" y="557" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">店铺工具处理已有规则的操作。</text>
<text x="136" y="605" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">人的责任</text>
<text x="282" y="605" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">核对商品细节与实物，决定生产；</text>
<text x="282" y="641" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">审核返工并确认素材可以上架。</text>
<rect x="930" y="307" width="766" height="380" rx="12" fill="#F3F6FC"/>
<rect x="930" y="307" width="5" height="380" rx="0" fill="#1D4ED8"/>
<text x="962" y="365" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">客服与私域社群</text>
<polyline points="962,392 1664,392" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="962" y="437" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">业务目标</text>
<text x="1108" y="437" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">客户问题及时解决，需要继续</text>
<text x="1108" y="473" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">跟进的人得到合适回应。</text>
<text x="962" y="521" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">技术辅助</text>
<text x="1108" y="521" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">常见问答有明确依据时辅助接待，</text>
<text x="1108" y="557" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">整理对话与待跟进事项。</text>
<text x="962" y="605" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">人的责任</text>
<text x="1108" y="605" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">维护政策与知识，承接升级问题，</text>
<text x="1108" y="641" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">处理复杂投诉、授权与例外承诺。</text>
<rect x="104" y="724" width="766" height="380" rx="12" fill="#F3F6FC"/>
<rect x="104" y="724" width="5" height="380" rx="0" fill="#1D4ED8"/>
<text x="136" y="782" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">市场与自媒体内容</text>
<polyline points="136,809 838,809" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="136" y="854" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">业务目标</text>
<text x="282" y="854" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">内容服务明确受众与业务目的，</text>
<text x="282" y="890" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">减少无效制作和投放。</text>
<text x="136" y="938" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">技术辅助</text>
<text x="282" y="938" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">整理资料、选题和脚本初稿，</text>
<text x="282" y="974" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">工具辅助剪辑与投放操作。</text>
<text x="136" y="1022" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">人的责任</text>
<text x="282" y="1022" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">判断证据、审美与可拍性，</text>
<text x="282" y="1058" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">决定创意、预算并验收交付。</text>
<rect x="930" y="724" width="766" height="380" rx="12" fill="#F3F6FC"/>
<rect x="930" y="724" width="5" height="380" rx="0" fill="#1D4ED8"/>
<text x="962" y="782" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">法务与专业服务</text>
<polyline points="962,809 1664,809" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="962" y="854" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">业务目标</text>
<text x="1108" y="854" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">及时交付有依据、可复核的</text>
<text x="1108" y="890" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">专业成果。</text>
<text x="962" y="938" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">技术辅助</text>
<text x="1108" y="938" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">整理材料、检索依据与起草，</text>
<text x="1108" y="974" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">计算和出图使用专业工具。</text>
<text x="962" y="1022" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">人的责任</text>
<text x="1108" y="1022" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">补齐事实、核实依据及适用性，</text>
<text x="1108" y="1058" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">完成专业判断与对外交付。</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">技术辅助需要可信资料、明确标准与人工承接。各岗位的采用范围仍需用真实任务验证。</text>
<text x="104" y="1243" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>