<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">个人工作方法经复用验证形成组织能力</title>
<desc id="description">依据2.4线索交接准备的说明性例子，展示资深市场人员与智能体完成线索交接的客户简报，保留查找核实、退回与修改依据，整理为Skill、工具或任务示例，由其他市场人员提供新客户资料复用，经过检验后纳入日常使用并持续维护。三种载体按任务需要组合。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-13  /  能力沉淀</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">个人工作方法经复用验证形成组织能力</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">资深市场人员的客户简报经验经过提炼、他人复用和验证，形成团队可以调用的方法。</text>
<rect x="104" y="311" width="292" height="307" rx="10" fill="#F3F6FC"/>
<text x="126" y="365" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">01</text>
<text x="126" y="423" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">完成真实任务</text>
<text x="126" y="468" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">资深市场人员与AI协作</text>
<polyline points="126,493 374,493" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="120" y="542" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">准备线索交接简报</text>
<text x="120" y="586" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">修改简报直到可用</text>
<polyline points="404,464 421,464" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="421,464 413.0,459.6 413.0,468.4" fill="#1D4ED8"/>
<rect x="429" y="311" width="292" height="307" rx="10" fill="#F3F6FC"/>
<text x="451" y="365" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">02</text>
<text x="451" y="423" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">保留判断过程</text>
<text x="451" y="468" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">关键判断关联具体产物</text>
<polyline points="451,493 699,493" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="445" y="542" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">查找与核实依据</text>
<text x="445" y="586" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">退回理由与修改示例</text>
<polyline points="729,464 746,464" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="746,464 738.0,459.6 738.0,468.4" fill="#1D4ED8"/>
<rect x="754" y="311" width="292" height="307" rx="10" fill="#F3F6FC"/>
<text x="776" y="365" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">03</text>
<text x="776" y="423" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">提炼复用方法</text>
<text x="776" y="468" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">区分共性与本次条件</text>
<polyline points="776,493 1024,493" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="770" y="542" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">明确输入与处理步骤</text>
<text x="770" y="586" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">保留判断和验收要求</text>
<polyline points="1054,464 1071,464" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1071,464 1063.0,459.6 1063.0,468.4" fill="#1D4ED8"/>
<rect x="1079" y="311" width="292" height="307" rx="10" fill="#F3F6FC"/>
<text x="1101" y="365" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">04</text>
<text x="1101" y="423" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">他人复用验证</text>
<text x="1101" y="468" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">其他市场人员复用</text>
<polyline points="1101,493 1349,493" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1095" y="542" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">提供本次客户资料</text>
<text x="1095" y="586" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">调用方法并核对结果</text>
<polyline points="1379,464 1396,464" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1396,464 1388.0,459.6 1388.0,468.4" fill="#1D4ED8"/>
<rect x="1404" y="311" width="292" height="307" rx="10" fill="#F3F6FC"/>
<text x="1426" y="365" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">05</text>
<text x="1426" y="423" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">进入组织日常</text>
<text x="1426" y="468" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">维护人根据反馈修订</text>
<polyline points="1426,493 1674,493" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1420" y="542" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">记录仍需请教的问题</text>
<text x="1420" y="586" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">经验证的方法持续使用</text>
<polyline points="1550,618 1550,653 900,653 900,618" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="900,618 895.05,627.0 904.95,627.0" fill="#1D4ED8"/>
<text x="1100" y="645" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">反馈用于修订方法</text>
<text x="104" y="683" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">客户简报经验按复用需要整理为三种载体</text>
<text x="104" y="723" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">三种形式可以组合使用，分别保留任务方法、稳定操作和完整处理过程。</text>
<rect x="104" y="756" width="516" height="210" rx="10" fill="#EAF1FF"/>
<text x="127" y="807" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">Skill：查找与核实方法</text>
<polyline points="127,830 597,830" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="127" y="882" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">适用任务、资料输入和简报步骤</text>
<text x="127" y="927" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">信息核实与交付检查要求</text>
<rect x="642" y="756" width="516" height="210" rx="10" fill="#EAF1FF"/>
<text x="665" y="807" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">工具：稳定查询与操作</text>
<polyline points="665,830 1135,830" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="665" y="882" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">按任务需要封装查询或校验</text>
<text x="665" y="927" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">使用者提供本次客户与资料</text>
<rect x="1180" y="756" width="516" height="210" rx="10" fill="#EAF1FF"/>
<text x="1203" y="807" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">任务示例：对话与修改过程</text>
<polyline points="1203,830 1673,830" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1203" y="882" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">保存必要背景、对话和修改依据</text>
<text x="1203" y="927" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">关联最终可用的客户简报</text>
<rect x="104" y="1002" width="1592" height="102" rx="10" fill="#F3F6FC"/>
<text x="132" y="1044" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">业务负责人确认适用范围、资料与工具条件、产物标准及人工判断事项。</text>
<text x="132" y="1081" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">维护人记录使用反馈、修订方法并维护版本，让后续任务继续使用有效做法。</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">示意依据本节线索交接准备例子整理；以其他人在新任务中形成的合格产物检验复用成效。</text>
<text x="104" y="1243" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>