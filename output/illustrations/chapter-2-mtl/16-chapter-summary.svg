<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">MTL岗位改造按任务分工与业务结果检验</title>
<desc id="description">第二章在从市场到线索的范围内，梳理岗位工作、核实业务差距、选择六项改进目标，再把18项业务举措落实为人、AI与程序的任务分工。检验合格产物、有效线索、销售实际接手和完整投入，后续端到端协同在第三章展开。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-16  /  本章小结</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">MTL岗位改造按任务分工与业务结果检验</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">从市场岗位的具体工作出发，逐项验证任务产物、有效线索与销售接手。</text>
<rect x="104" y="319" width="356" height="292" rx="12" fill="#F3F6FC"/>
<text x="130" y="369" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">01</text>
<text x="130" y="427" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">MTL岗位工作</text>
<text x="130" y="481" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">梳理工作与交接产物</text>
<text x="130" y="525" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">确定线索范围与标准</text>
<text x="130" y="569" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">连接销售实际接手</text>
<polyline points="473,469 503,469" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="503,469 494.0,464.05 494.0,473.95" fill="#1D4ED8"/>
<rect x="516" y="319" width="356" height="292" rx="12" fill="#F3F6FC"/>
<text x="542" y="369" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">02</text>
<text x="542" y="427" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">业务差距与目标</text>
<text x="542" y="481" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">核实实际工作问题</text>
<text x="542" y="525" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">选择六目标中的重点</text>
<text x="542" y="569" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">固定批次和观察口径</text>
<polyline points="885,469 915,469" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="915,469 906.0,464.05 906.0,473.95" fill="#1D4ED8"/>
<rect x="928" y="319" width="356" height="292" rx="12" fill="#F3F6FC"/>
<text x="954" y="369" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">03</text>
<text x="954" y="427" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">18项业务举措</text>
<text x="954" y="481" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">明确业务上怎样改善</text>
<text x="954" y="525" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">核对资料及系统条件</text>
<text x="954" y="569" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">确定产物和适用范围</text>
<polyline points="1297,469 1327,469" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1327,469 1318.0,464.05 1318.0,473.95" fill="#1D4ED8"/>
<rect x="1340" y="319" width="356" height="292" rx="12" fill="#F3F6FC"/>
<text x="1366" y="369" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">04</text>
<text x="1366" y="427" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">任务分工与验收</text>
<text x="1366" y="481" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">安排人、AI与程序</text>
<text x="1366" y="525" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">明确执行和验收责任</text>
<text x="1366" y="569" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">保留核实与退回依据</text>
<text x="104" y="691" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">改造的评价同时检查合格产物、实际承接与完整投入</text>
<rect x="104" y="737" width="500" height="264" rx="12" fill="#EAF1FF"/>
<text x="132" y="797" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">合格产物</text>
<text x="132" y="857" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">内容和简报通过核实</text>
<text x="132" y="904" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">线索信息达到有效标准</text>
<text x="132" y="951" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">退回与返工如实记录</text>
<rect x="650" y="737" width="500" height="264" rx="12" fill="#EAF1FF"/>
<text x="678" y="797" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">MTL业务结果</text>
<text x="678" y="857" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">有效线索按同批口径验证</text>
<text x="678" y="904" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">销售实际接手并反馈</text>
<text x="678" y="951" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">按来源检查退回与改善</text>
<rect x="1196" y="737" width="500" height="264" rx="12" fill="#EAF1FF"/>
<text x="1224" y="797" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">完整投入</text>
<text x="1224" y="857" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">资料、制作、调用及核验</text>
<text x="1224" y="904" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">返工、配套、运行及维护</text>
<text x="1224" y="951" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">比较单位有效线索投入</text>
<text x="104" y="1090" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">第三章继续沿完整业务流程分析市场、销售、产品、交付和财务怎样协同完成结果。</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">本章六目标和18举措由本报告整理。岗位提效需要通过实际采用、业务结果和全部投入检验。</text>
<text x="104" y="1243" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>