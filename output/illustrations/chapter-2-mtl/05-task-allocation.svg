<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">业务举措落实为可分工与可验收的任务</title>
<desc id="description">以线索交接客户简报为例，将业务目标落实为输入、产物、分工和验收条件。AI整理有依据的简报，程序关联记录和检查字段，市场人员核实，销售确认可以接手。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-05  /  业务举措</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">业务举措落实为可分工与可验收的任务</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">以线索交接客户简报为例，先写清任务约定，再安排人、AI与程序。</text>
<rect x="104" y="329" width="500" height="214" rx="12" fill="#EAF1FF"/>
<text x="134" y="391" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">输入与依据</text>
<text x="134" y="451" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">来源、客户资料与原始询问</text>
<text x="134" y="495" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">有效标准和已有核实记录</text>
<polyline points="614,437 640,437" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="640,437 631.0,432.05 631.0,441.95" fill="#1D4ED8"/>
<rect x="650" y="329" width="500" height="214" rx="12" fill="#EAF1FF"/>
<text x="680" y="391" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">可检查的产物</text>
<text x="680" y="451" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">客户背景、需求与证据索引</text>
<text x="680" y="495" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">未决事项和建议下一步</text>
<polyline points="1160,437 1186,437" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1186,437 1177.0,432.05 1177.0,441.95" fill="#1D4ED8"/>
<rect x="1196" y="329" width="500" height="214" rx="12" fill="#EAF1FF"/>
<text x="1226" y="391" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">接手与验收</text>
<text x="1226" y="451" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">市场人员核实并修正简报</text>
<text x="1226" y="495" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">销售确认能够开展首次跟进</text>
<polyline points="104,619 604,619" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="680" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">AI辅助整理与查漏</text>
<text x="104" y="757" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">从有效资料整理简报草稿</text>
<text x="104" y="817" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">区分事实、判断和待确认项</text>
<text x="104" y="877" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">提示缺项及前后矛盾</text>
<polyline points="650,619 1150,619" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="650" y="680" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">程序保存与规则检查</text>
<text x="650" y="757" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">关联来源、记录和材料版本</text>
<text x="650" y="817" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">按确定规则检查字段与去重</text>
<text x="650" y="877" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">登记授权内的分配和提醒</text>
<polyline points="1196,619 1696,619" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1196" y="680" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">人核实并承担结果</text>
<text x="1196" y="757" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">市场人员核实来源与需求</text>
<text x="1196" y="817" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">销售确认接手并实际跟进</text>
<text x="1196" y="877" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">负责人处理异常和资源取舍</text>
<rect x="104" y="983" width="1592" height="118" rx="10" fill="#F3F6FC"/>
<text x="900" y="1034" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">资料、权限、执行者和验收条件共同支撑任务分工。</text>
<text x="900" y="1079" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="middle">简报生成以后继续检查内容可用性、销售采用情况和完整投入。</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">分工按真实任务和当前可用能力验证。未确认的判断需显式标注，并由相应人员处理。</text>
<text x="104" y="1243" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>