<text x="130" y="361" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">01</text>
<text x="196" y="361" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">目标市场与客户</text>
<text x="130" y="410" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">完成的工作</text>
<text x="130" y="453" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">整理信号，比较客户与来源</text>
<text x="130" y="492" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">共同确定客群和有效标准</text>
