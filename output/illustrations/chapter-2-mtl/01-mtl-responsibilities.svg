<text x="676" y="601" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">内容简报与有效产品依据</text>
<text x="676" y="635" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">经审核内容和答问材料</text>
