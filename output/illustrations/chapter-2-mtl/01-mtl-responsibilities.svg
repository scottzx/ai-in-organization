<text x="130" y="561" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">主要交接产物</text>
<text x="130" y="601" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">市场客户信号与比较依据</text>
<text x="130" y="635" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">目标客群及有效线索标准</text>
