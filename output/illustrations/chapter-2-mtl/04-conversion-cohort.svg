<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">有效率与接收率按同一批对象计算</title>
<desc id="description">固定进入核实的候选对象批次和跟踪截止日，同批有效线索除以进入核实的同批候选对象得到有效率，同批实际接收的有效线索除以同批有效线索得到接收率。曝光和市场接触不进入候选对象分母。培育、退出与未接收对象不因结果不好而从各自分母移除。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-04  /  业务分析</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">有效率与接收率按同一批对象计算</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">先固定进入核实的候选批次与截止日，再核对有效线索和销售实际接收。</text>
<rect x="104" y="321" width="500" height="264" rx="12" fill="#F3F6FC"/>
<text x="132" y="381" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">固定核实候选批次</text>
<text x="132" y="443" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">仅包含进入核实的候选记录</text>
<text x="132" y="489" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">去重规则与来源口径一致</text>
<text x="132" y="535" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">保留全部本批候选对象</text>
<polyline points="614,451 640,451" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="640,451 631.0,446.05 631.0,455.95" fill="#1D4ED8"/>
<rect x="650" y="321" width="500" height="264" rx="12" fill="#EAF1FF"/>
<text x="678" y="381" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">核实有效线索</text>
<text x="678" y="443" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">按双方确认标准判断</text>
<text x="678" y="489" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">保留依据与未满足条件</text>
<text x="678" y="535" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">培育与退出继续留在候选分母</text>
<polyline points="1160,451 1186,451" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1186,451 1177.0,446.05 1177.0,455.95" fill="#1D4ED8"/>
<rect x="1196" y="321" width="500" height="264" rx="12" fill="#EAF1FF"/>
<text x="1224" y="381" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">记录实际接收</text>
<text x="1224" y="443" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">有效线索取得接收确认</text>
<text x="1224" y="489" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">未接收和退回仍留在有效分母</text>
<text x="1224" y="535" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">记录首次反馈及处理原因</text>
<text x="104" y="736" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">候选对象有效率</text>
<text x="415" y="736" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">=</text>
<text x="1000" y="695" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">该批截至截止日经核实的有效线索数</text>
<polyline points="475,716 1525,716" fill="none" stroke="#17365D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1000" y="763" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">该批进入核实的候选对象总数</text>
<text x="1570" y="736" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">× 100%</text>
<text x="104" y="942" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">销售接收率</text>
<text x="415" y="942" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">=</text>
<text x="1000" y="901" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">该批截至截止日销售实际接收的有效线索数</text>
<polyline points="475,922 1525,922" fill="none" stroke="#17365D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1000" y="969" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">该批截至截止日经核实的有效线索数</text>
<text x="1570" y="942" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">× 100%</text>
<text x="104" y="1090" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">截止日尚未完成核实或跟进的对象继续保留状态，并在后续观察中更新。</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">批次、有效标准、去重和接收证据固定后再比较。停留中的对象尚不能判为最终失败。</text>
<text x="104" y="1243" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>