<text x="1174" y="417" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">人的职责</text>
<text x="1174" y="464" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">人员核实对象与联系可用性</text>
