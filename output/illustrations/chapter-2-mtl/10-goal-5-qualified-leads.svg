<text x="655" y="677" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">AI与程序辅助</text>
<text x="655" y="724" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">AI提示缺项并整理核实问题</text>
