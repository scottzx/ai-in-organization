<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">目标5：提高候选对象成为有效线索的比例</title>
<desc id="description">目标5：提高候选对象成为有效线索的比例。举措5.1核实对象联系条件与需求匹配；举措5.2按标准补齐信息；举措5.3交接培育退出分别安排。任务及辅助分工为本报告整理，人员核实并承担结果责任。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-10  /  业务举措</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">目标5：提高候选对象成为有效线索的比例</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">有效线索经过核实；尚未达到标准的对象分别安排培育或退出。</text>
<rect x="104" y="304" width="1592" height="228" rx="12" fill="#F3F6FC"/>
<text x="136" y="351" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">举措 5.1</text>
<text x="305" y="351" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">核实对象联系条件与需求匹配</text>
<polyline points="136,372 1664,372" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="136" y="417" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">任务与产物</text>
<text x="136" y="464" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">核实对象、联系条件与需求</text>
<text x="136" y="505" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">交付带依据的核实结果</text>
<polyline points="630,397 630,507" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="655" y="417" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">AI与程序辅助</text>
<text x="655" y="464" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">AI整理已有信息与待核实项</text>
<text x="655" y="505" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">程序比对确定字段和重复项</text>
