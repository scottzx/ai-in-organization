<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">MTL的业务结果与六项改进目标</title>
<desc id="description">市场接触产生可追踪回应，回应中的候选对象登记背景并进入核实，符合标准的有效线索由销售实际接手。六项改进目标从客群、表达、活动、询盘、核实和交接支持这一结果链，关系由本报告整理。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-02  /  业务分析</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">MTL的业务结果与六项改进目标</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">市场活动形成可追踪回应，候选对象经核实成为销售能够接手的有效线索。</text>
<rect x="104" y="322" width="356" height="226" rx="12" fill="#F3F6FC"/>
<text x="132" y="385" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">市场接触</text>
<text x="132" y="450" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">面向目标客群</text>
<text x="132" y="497" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">保留来源依据</text>
<polyline points="473,434 503,434" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="503,434 492.0,427.95 492.0,440.05" fill="#1D4ED8"/>
<rect x="516" y="322" width="356" height="226" rx="12" fill="#F3F6FC"/>
<text x="544" y="385" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">可追踪回应</text>
<text x="544" y="450" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">登记候选与背景</text>
<text x="544" y="497" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">关联活动和询盘</text>
<polyline points="885,434 915,434" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="915,434 904.0,427.95 904.0,440.05" fill="#1D4ED8"/>
<rect x="928" y="322" width="356" height="226" rx="12" fill="#EAF1FF"/>
<text x="956" y="385" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">有效线索</text>
<text x="956" y="450" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">符合双方确认标准</text>
<text x="956" y="497" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">必要信息经过核实</text>
<polyline points="1297,434 1327,434" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1327,434 1316.0,427.95 1316.0,440.05" fill="#1D4ED8"/>
<rect x="1340" y="322" width="356" height="226" rx="12" fill="#EAF1FF"/>
<text x="1368" y="385" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">销售实际接手</text>
<text x="1368" y="450" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">确认接收与责任人</text>
<text x="1368" y="497" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">取得首次跟进反馈</text>
<text x="104" y="625" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">六项改进分别落实到市场工作、核实与实际承接</text>
<rect x="104" y="670" width="766" height="102" rx="10" fill="#F3F6FC"/>
<text x="132" y="734" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">01</text>
<text x="198" y="734" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">明确目标市场与客户</text>
<rect x="930" y="670" width="766" height="102" rx="10" fill="#F3F6FC"/>
<text x="958" y="734" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">02</text>
<text x="1024" y="734" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">形成准确的价值表达</text>
<rect x="104" y="803" width="766" height="102" rx="10" fill="#F3F6FC"/>
<text x="132" y="867" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">03</text>
<text x="198" y="867" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">让市场活动产生可追踪回应</text>
<rect x="930" y="803" width="766" height="102" rx="10" fill="#F3F6FC"/>
<text x="958" y="867" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">04</text>
<text x="1024" y="867" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">及时接住询盘并留下背景</text>
<rect x="104" y="936" width="766" height="102" rx="10" fill="#F3F6FC"/>
<text x="132" y="1000" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">05</text>
<text x="198" y="1000" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">提高候选对象成为有效线索的比例</text>
<rect x="930" y="936" width="766" height="102" rx="10" fill="#F3F6FC"/>
<text x="958" y="1000" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">06</text>
<text x="1024" y="1000" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">让有效线索被销售实际接手</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">回应中的候选记录进入核实。关系和六目标由本报告整理，不作为统一官方阶段定义。</text>
<text x="104" y="1243" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
