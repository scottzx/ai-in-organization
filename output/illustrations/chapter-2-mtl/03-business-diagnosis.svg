<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">业务差距经核实后形成改进目标</title>
<desc id="description">以市场工作差距为起点，核实资料与真实任务，选择六目标中的重点，固定基线和观察安排，并跟踪有效线索、实际接收及投入。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-03  /  业务分析</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">业务差距经核实后形成改进目标</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">业务负责人核实市场工作差距，再按约定口径跟踪有效线索与实际承接。</text>
<text x="104" y="373" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">01</text>
<polyline points="104,405 356,405" fill="none" stroke="#B8C9E6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="465" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">识别表现差距</text>
<text x="104" y="537" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">检查来源与回应</text>
<text x="104" y="587" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">比较有效线索比例</text>
<text x="104" y="637" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">定位退回与等待</text>
<polyline points="378,444 411,444" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="411,444 402.0,439.05 402.0,448.95" fill="#1D4ED8"/>
<text x="434" y="373" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">02</text>
<polyline points="434,405 686,405" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="434" y="465" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">核实工作问题</text>
<text x="434" y="537" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">访谈市场与销售</text>
<text x="434" y="587" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">核对记录和真实任务</text>
<text x="434" y="637" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">查清缺项与错误</text>
<polyline points="708,444 741,444" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="741,444 732.0,439.05 732.0,448.95" fill="#1D4ED8"/>
<text x="764" y="373" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">03</text>
<polyline points="764,405 1016,405" fill="none" stroke="#B8C9E6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="764" y="465" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">选定重点目标</text>
<text x="764" y="537" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">选择本轮改进重点</text>
<text x="764" y="587" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">明确期望业务表现</text>
<text x="764" y="637" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">对应六项改进目标</text>
<polyline points="1038,444 1071,444" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1071,444 1062.0,439.05 1062.0,448.95" fill="#1D4ED8"/>
<text x="1094" y="373" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">04</text>
<polyline points="1094,405 1346,405" fill="none" stroke="#B8C9E6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1094" y="465" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">明确观察安排</text>
<text x="1094" y="537" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">登记当前值与目标值</text>
<text x="1094" y="587" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">固定批次、期限与口径</text>
<text x="1094" y="637" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">指定记录责任人</text>
<polyline points="1368,444 1401,444" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1401,444 1392.0,439.05 1392.0,448.95" fill="#1D4ED8"/>
<text x="1424" y="373" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">05</text>
<polyline points="1424,405 1676,405" fill="none" stroke="#B8C9E6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1424" y="465" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">跟踪业务结果</text>
<text x="1424" y="537" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">记录有效与实际接收</text>
<text x="1424" y="587" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">核实退回与培育原因</text>
<text x="1424" y="637" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">复核来源表现及投入</text>
<polyline points="1543,714 1543,752 230,752 230,710" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="230,730 230,710" fill="none" stroke="#53657F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="230,710 225.05,719.0 234.95,719.0" fill="#53657F"/>
<rect x="649" y="727" width="512" height="46" rx="0" fill="#FFFFFF"/>
<text x="905" y="759" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="middle">跟踪结果用于复核和调整改进重点</text>
<rect x="104" y="845" width="1592" height="242" rx="12" fill="#F3F6FC"/>
<text x="140" y="902" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">过程变化需要继续接受业务结果检验</text>
<text x="140" y="969" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">制作工时 · 回应速度 · 记录质量</text>
<text x="140" y="1024" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">用于解释工作过程的变化。</text>
<polyline points="784,984 967,984" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="967,984 956.0,977.95 956.0,990.05" fill="#1D4ED8"/>
<text x="1005" y="969" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">有效线索 · 实际接收 · 完整投入</text>
<text x="1005" y="1024" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">用于判断本轮业务表现。</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">差距需通过访谈、记录和真实任务核实。过程指标改善后，仍需检查MTL业务结果。</text>
<text x="104" y="1243" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>