<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">目标4：及时接住询盘并留下背景</title>
<desc id="description">目标4：及时接住询盘并留下背景。举措4.1统一入口记录与去重；举措4.2回答有依据的问题并初步了解需求；举措4.3复杂/例外转给相应人员。任务及辅助分工为本报告整理，人员核实并承担结果责任。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-09  /  业务举措</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">目标4：及时接住询盘并留下背景</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">询盘回应保留需求背景和未决事项，复杂问题有明确人员承接。</text>
<rect x="104" y="304" width="1592" height="228" rx="12" fill="#F3F6FC"/>
<text x="136" y="351" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">举措 4.1</text>
<text x="305" y="351" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">统一入口记录与去重</text>
<polyline points="136,372 1664,372" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="136" y="417" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">任务与产物</text>
<text x="136" y="464" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">归集入口、对象与原始询问</text>
<text x="136" y="505" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">交付带来源的询盘记录</text>
<polyline points="630,397 630,507" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="655" y="417" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">AI与程序辅助</text>
<text x="655" y="464" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">程序按标识记录与去重</text>
<text x="655" y="505" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">AI辅助提取缺失字段</text>
<polyline points="1149,397 1149,507" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1174" y="417" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">人的职责</text>
<text x="1174" y="464" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">市场人员核对对象与来源</text>
<text x="1174" y="505" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">处理不能可靠合并的记录</text>
<rect x="104" y="564" width="1592" height="228" rx="12" fill="#F3F6FC"/>
<text x="136" y="611" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">举措 4.2</text>
<text x="305" y="611" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">回答有依据的问题并初步了解需求</text>
<polyline points="136,632 1664,632" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="136" y="677" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">任务与产物</text>
<text x="136" y="724" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">回应可确认问题并了解需求</text>
<text x="136" y="765" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">交付回应依据与需求背景</text>
<polyline points="630,657 630,767" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="655" y="677" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">AI与程序辅助</text>
<text x="655" y="724" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">AI依据有效知识辅助答复</text>
<text x="655" y="765" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">程序保留对话与知识版本</text>
<polyline points="1149,657 1149,767" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1174" y="677" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">人的职责</text>
<text x="1174" y="724" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">人员核实依据与适用条件</text>
<text x="1174" y="765" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">明确尚未确认的需求事项</text>
<rect x="104" y="824" width="1592" height="228" rx="12" fill="#EAF1FF"/>
<text x="136" y="871" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">举措 4.3</text>
<text x="305" y="871" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">复杂/例外转给相应人员</text>
<polyline points="136,892 1664,892" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="136" y="937" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">任务与产物</text>
<text x="136" y="984" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">识别需要专业判断的事项</text>
<text x="136" y="1025" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">交付问题背景与承接安排</text>
<polyline points="630,917 630,1027" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="655" y="937" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">AI与程序辅助</text>
<text x="655" y="984" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">AI提示信息缺项与转交原因</text>
<text x="655" y="1025" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">程序记录承接者和处理状态</text>
<polyline points="1149,917 1149,1027" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1174" y="937" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="28" font-weight="500" data-text-style="narrow_heading" text-anchor="start">人的职责</text>
<text x="1174" y="984" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">相应人员判断复杂与例外</text>
<text x="1174" y="1025" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">确认接手并承担后续回应</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">响应速度与问题是否解决分别检验。未经批准的承诺不能进入自动答复。</text>
<text x="104" y="1243" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>