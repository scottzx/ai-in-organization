<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1216" viewBox="85 49 1630 1216" role="img" aria-labelledby="title description">
<title id="title">目标2：形成准确的价值表达</title>
<desc id="description">目标2：形成准确的价值表达。举措2.1明确客户问题与传播目的；举措2.2核实产品能力、适用条件与证据；举措2.3准备并审核内容。任务及辅助分工为本报告整理，人员核实并承担结果责任。</desc>
<rect x="85" y="49" width="1630" height="1216" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-07  /  业务举措</text>
<text x="1696" y="88" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="WenQuanYi Zen Hei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">目标2：形成准确的价值表达</text>
<text x="104" y="237" fill="#53657F" font-family="WenQuanYi Zen Hei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">有依据的内容明确客户问题、能力边界与下一步回应方式。</text>
