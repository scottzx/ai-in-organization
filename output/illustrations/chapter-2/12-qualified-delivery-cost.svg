<rect x="1216" y="793" width="480" height="83" rx="8" fill="#F3F6FC"/>
<text x="1456" y="847" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">协调与异常处置</text>
