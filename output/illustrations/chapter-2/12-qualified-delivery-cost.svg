<text x="988" y="396" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">改进做法</text>
<text x="988" y="452" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">计入完成同等交付的全部投入。</text>
<text x="988" y="495" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">保留采用情况与实际交付记录。</text>
