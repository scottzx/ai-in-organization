<text x="104" y="1202" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">节时、响应改善与经营结果分别记录。单次生成价格不能代表完整交付成本。</text>
