<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1214" viewBox="85 50 1630 1214" role="img" aria-labelledby="title description">
<title id="title">销售漏斗与六项业务改进目标</title>
<desc id="description">目标1扩大有效线索基数，目标2改善线索转商机，目标3至6共同支持商机转合同。</desc>
<rect x="85" y="50" width="1630" height="1214" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-02  /  业务分析</text>
<text x="1696" y="88" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">销售漏斗与六项业务改进目标</text>
<text x="104" y="237" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">有效线索基数与阶段转化率共同影响签约合同数量。</text>
<text x="510" y="326" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">潜在线索</text>
<polyline points="510,346 510,394" fill="none" stroke="#53657F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="510,394 516.05,383.0 503.95,383.0" fill="#53657F"/>
<text x="548" y="379" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">初筛与核实</text>
<polygon points="190,410 830,410 770,552 250,552" fill="#EAF1FF"/>
<text x="510" y="473" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="48" font-weight="500" data-text-style="display" text-anchor="middle">有效线索</text>
<text x="510" y="521" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="middle">符合目标客群与可跟进标准</text>
<polyline points="510,566 510,636" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="510,636 516.05,625.0 503.95,625.0" fill="#1D4ED8"/>
<rect x="362" y="584" width="296" height="43" rx="0" fill="#FFFFFF"/>
<text x="510" y="615" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">线索转商机率</text>
<polygon points="260,654 760,654 710,798 310,798" fill="#C8D8FF"/>
<text x="510" y="721" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="48" font-weight="500" data-text-style="display" text-anchor="middle">商机</text>
<text x="510" y="767" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="middle">需求与推进条件经过验证</text>
<polyline points="510,813 510,915" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="510,915 516.05,904.0 503.95,904.0" fill="#1D4ED8"/>
<rect x="362" y="842" width="296" height="43" rx="0" fill="#FFFFFF"/>
<text x="510" y="874" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="middle">商机转合同率</text>
<polygon points="320,933 700,933 662,1064 358,1064" fill="#1D4ED8"/>
<text x="510" y="1009" fill="#FFFFFF" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="48" font-weight="500" data-text-style="display" text-anchor="middle">签约合同</text>
<polyline points="847,479 955,479" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="847" cy="479" r="4" fill="#1D4ED8"/>
<text x="1010" y="439" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">目标 1</text>
<text x="1010" y="491" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">持续增加有效线索</text>
<text x="1010" y="534" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">线索开发与筛选持续扩大有效基数。</text>
<polyline points="701,603 955,603" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="701" cy="603" r="4" fill="#1D4ED8"/>
<text x="1010" y="590" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">目标 2</text>
<text x="1010" y="642" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">提高线索转为商机的比例</text>
<text x="1010" y="685" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">客户了解与机会验证支持阶段转化。</text>
<polyline points="701,862 955,862" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="701" cy="862" r="4" fill="#1D4ED8"/>
<polyline points="981,785 965,785 965,1076 981,1076" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1010" y="785" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">目标 3—6</text>
<text x="1010" y="837" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">共同支持商机转合同</text>
<text x="1010" y="898" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">03</text>
<text x="1067" y="898" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">准确确认需求与沟通输出</text>
<text x="1010" y="952" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">04</text>
<text x="1067" y="952" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">完善方案与商务准备</text>
<text x="1010" y="1006" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">05</text>
<text x="1067" y="1006" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">落实会后执行与验收</text>
<text x="1010" y="1060" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">06</text>
<text x="1067" y="1060" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">推进客户决策与签约</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">漏斗宽度仅作示意。六项改进的效果需结合企业基线与持续记录验证。</text>
<text x="104" y="1243" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>