<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1214" viewBox="85 50 1630 1214" role="img" aria-labelledby="title description">
<title id="title">目标5：让会后任务完成并通过验收</title>
<desc id="description">把已确认决定落实为有输入、产物、执行者、期限和验收人的任务。执行者确认接手，完成并提交产物，验收通过后再关闭和交接，阻塞与退回分别进入协调和修改。</desc>
<rect x="85" y="50" width="1630" height="1214" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-10  /  业务举措</text>
<text x="1696" y="88" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">目标5：让会后任务完成并通过验收</text>
<text x="104" y="237" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">任务从已确认决定出发，经过实际执行与验收后进入下一步。</text>
<rect x="104" y="327" width="1592" height="190" rx="12" fill="#F3F6FC"/>
<text x="137" y="376" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">任务交接先写清五项约定</text>
<text x="137" y="434" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">输入依据</text>
<text x="137" y="480" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">使用已确认记录</text>
<polyline points="427,402 427,489" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="449" y="434" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">交付产物</text>
<text x="449" y="480" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">写明可检查的输出</text>
<polyline points="739,402 739,489" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="761" y="434" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">执行者</text>
<text x="761" y="480" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">确认接手与资源</text>
<polyline points="1051,402 1051,489" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1073" y="434" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">完成期限</text>
<text x="1073" y="480" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">约定合理时间</text>
<polyline points="1363,402 1363,489" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1385" y="434" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">验收人</text>
<text x="1385" y="480" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="start">依据标准判断可用</text>
