<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1214" viewBox="85 50 1630 1214" role="img" aria-labelledby="title description">
<title id="title">业务差距经核实后形成改进目标</title>
<desc id="description">诊断从待核实差距出发，经访谈、记录与真实任务核实工作问题，再选定目标、明确观察安排并跟踪结果。</desc>
<rect x="85" y="50" width="1630" height="1214" fill="#FFFFFF"/>
<rect x="104" y="76" width="44" height="5" rx="0" fill="#1D4ED8"/>
<text x="165" y="88" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">图 2-03  /  业务分析</text>
<text x="1696" y="88" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="end">一芥智能研究院</text>
<text x="104" y="177" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="58" font-weight="500" data-text-style="title" text-anchor="start">业务差距经核实后形成改进目标</text>
<text x="104" y="237" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="300" data-text-style="subtitle" text-anchor="start">业务负责人从表现差距出发，核实工作问题并持续跟踪改进。</text>
<text x="104" y="382" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">01</text>
<polyline points="104,412 356,412" fill="none" stroke="#B8C9E6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="474" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">识别表现差距</text>
<text x="104" y="546" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">检查有效线索基数</text>
<text x="104" y="597" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">比较阶段转化情况</text>
<text x="104" y="648" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">定位流失与停滞</text>
<polyline points="378,451 411,451" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="411,451 402.0,446.05 402.0,455.95" fill="#1D4ED8"/>
<text x="434" y="382" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">02</text>
<polyline points="434,412 686,412" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="434" y="474" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">核实工作问题</text>
<text x="434" y="546" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">访谈业务人员</text>
<text x="434" y="597" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">核对记录与真实任务</text>
<text x="434" y="648" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">确认具体工作问题</text>
<polyline points="708,451 741,451" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="741,451 732.0,446.05 732.0,455.95" fill="#1D4ED8"/>
<text x="764" y="382" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">03</text>
<polyline points="764,412 1016,412" fill="none" stroke="#B8C9E6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="764" y="474" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">选定重点目标</text>
<text x="764" y="546" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">选择本轮改进重点</text>
<text x="764" y="597" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">明确期望业务表现</text>
<text x="764" y="648" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">对应六项改进目标</text>
<polyline points="1038,451 1071,451" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1071,451 1062.0,446.05 1062.0,455.95" fill="#1D4ED8"/>
<text x="1094" y="382" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">04</text>
<polyline points="1094,412 1346,412" fill="none" stroke="#B8C9E6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1094" y="474" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">明确观察安排</text>
<text x="1094" y="546" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">登记当前值与目标值</text>
<text x="1094" y="597" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">固定观察期与口径</text>
<text x="1094" y="648" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">指定记录责任人</text>
<polyline points="1368,451 1401,451" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1401,451 1392.0,446.05 1392.0,455.95" fill="#1D4ED8"/>
<text x="1424" y="382" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="500" data-text-style="step" text-anchor="start">05</text>
<polyline points="1424,412 1676,412" fill="none" stroke="#B8C9E6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1424" y="474" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="500" data-text-style="heading" text-anchor="start">跟踪业务结果</text>
<text x="1424" y="546" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">持续记录线索与转化</text>
<text x="1424" y="597" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">核对丢单或延迟原因</text>
<text x="1424" y="648" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">复核本轮改进表现</text>
<polyline points="1543,704 1543,751 230,751 230,706" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="230,730 230,706" fill="none" stroke="#53657F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="230,706 225.05,715.0 234.95,715.0" fill="#53657F"/>
<rect x="661" y="727" width="488" height="46" rx="0" fill="#FFFFFF"/>
<text x="905" y="759" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="middle">跟踪结果用于复核与调整改进重点。</text>
<rect x="104" y="847" width="1592" height="227" rx="12" fill="#F3F6FC"/>
<text x="145" y="902" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" data-text-style="subheading" text-anchor="start">过程变化需要继续接受业务结果检验</text>
<text x="145" y="970" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">整理工时 · 记录质量 · 方案返工</text>
<text x="145" y="1021" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">用于解释工作过程的变化。</text>
<polyline points="776,984 990,984" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="990,984 979.0,977.95 979.0,990.05" fill="#1D4ED8"/>
<text x="883" y="956" fill="#1D4ED8" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="300" data-text-style="dense_body" text-anchor="middle">继续检验</text>
<text x="1040" y="970" fill="#17365D" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">有效线索 · 阶段转化 · 签约合同</text>
<text x="1040" y="1021" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="300" data-text-style="body" text-anchor="start">用于判断业务表现的改善。</text>
<polyline points="104,1152 1696,1152" fill="none" stroke="#B8C9E6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104" y="1202" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">差距需通过访谈、记录与真实任务核实。过程指标的改善仍需通过业务结果检验。</text>
<text x="104" y="1243" fill="#53657F" font-family="Heiti SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="300" data-text-style="label" text-anchor="start">《企业数智化转型研究报告》 · 第二章 · 一芥智能研究院</text>
</svg>