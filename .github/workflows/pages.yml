name: Publish report website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-site.txt
      - run: python -m pip install -r scripts/requirements-site.txt
      - run: python scripts/validate.py
      - run: python scripts/validate-middle.py
      - run: python scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  mirror:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-site.txt
      - name: Build the domestic reader
        env:
          REPORT_SITE_URL: https://www.dreammate.work/report/ai-transformation-2026/
        run: python scripts/build-site.py
      - name: Publish to Tencent Cloud
        env:
          REPORT_MIRROR_SSH_KEY: ${{ secrets.REPORT_MIRROR_SSH_KEY }}
        run: |
          set -euo pipefail
          report_ssh_dir="$RUNNER_TEMP/report-mirror-ssh"
          install -d -m 700 "$report_ssh_dir"
          trap 'rm -f "$report_ssh_dir/key"' EXIT
          printf '%s\n' "$REPORT_MIRROR_SSH_KEY" > "$report_ssh_dir/key"
          chmod 600 "$report_ssh_dir/key"
          python - <<'PY'
          import os, tarfile
          from pathlib import Path
          site = Path('_site')
          with tarfile.open(Path(os.environ['RUNNER_TEMP']) / 'report-site.tar.gz', 'w:gz') as archive:
              for path in sorted(site.rglob('*')):
                  if path.is_file():
                      archive.add(path, arcname=str(path.relative_to(site)), recursive=False)
          PY
          ssh -i "$report_ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=.github/report-mirror-known-hosts \
            reportmirror@49.235.24.95 "publish $GITHUB_SHA" < "$RUNNER_TEMP/report-site.tar.gz"
